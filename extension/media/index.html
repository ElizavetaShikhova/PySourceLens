<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>PySourceLens</title>
  <link rel="stylesheet" href="{{styleUri}}">
</head>
<body>
<div id="layout">
  <div id="sidebar">
    <div id="sidebar-header">Проект</div>
    <div id="file-tree"></div>
    <div id="sidebar-info">
      <div id="sidebar-module-info"></div>
      <div id="sidebar-element-info"></div>
    </div>
  </div>
  <div id="main">
    <div id="level-header">
      <span id="level-kind">УРОВЕНЬ: ПРОЕКТ</span>
      <span id="level-title"></span>
       <div id="navigation-buttons" style="margin-top: 8px; display: none;">
    </div>
    </div>
    <div id="level-body">
      <div id="diagram"></div>
      <div id="details">
        <div id="details-header"></div>
        <div id="code-block" style="margin-top:6px;"></div>
      </div>
    </div>
  </div>
</div>

<script src="{{scriptUri}}"></script>
</body>
</html>
